<!doctype html>
<html lang="de" dir="ltr">
	<head>
		<title>React Standalone | KoliBri</title>
		<meta charset="UTF-8" />
		<meta name="description" content="Webanwendung mit der KoliBri-Komponentenbibliothek." />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="shortcut icon" type="image/x-icon" href="assets/kolibri.ico" />
		<link rel="stylesheet" href="assets/codicons/codicon.css" />
		<link rel="stylesheet" href="assets/fontawesome-free/css/all.min.css" />
		<link rel="stylesheet" href="style.css" />
		<meta name="robots" content="noindex" />
		<meta name="kolibri" content="dev-mode=true" />
	</head>
	<body>
		<div class="itzbund container mx-auto my-10 max-w-800px">
			<header class="text-center">
				<div class="grid grid-cols-2 items-center">
					<div>
						<kol-kolibri class="block m-auto w-40" _labeled="false"></kol-kolibri>
					</div>
					<div>
						<img class="block m-auto h-25" src="assets/logo.react.png" alt="Logo vom React Framework" />
					</div>
				</div>
				<kol-heading _label="Willkommen zu KoliBri"></kol-heading>
			</header>
			<main class="grid md:grid-cols-2 gap-6 p-12">
				<kol-alert _type="success" _label="Manifest" _variant="card" _level="2">
					<kol-link
						_href="https://public-ui.github.io/en/docs/manifest"
						_icons="fa-solid fa-scroll"
						_label="Manifest öffnen"
						_target="_blank"
					></kol-link>
				</kol-alert>
				<kol-alert _type="info" _label="Konzepte" _variant="card" _level="2">
					<kol-link
						_href="https://public-ui.github.io/en/docs/concepts/architecture"
						_icons="fa-solid fa-sitemap"
						_label="Konzepte öffnen"
						_target="_blank"
					></kol-link>
				</kol-alert>
				<kol-alert _type="warning" _label="Komponenten" _variant="card" _level="2">
					<kol-link
						_href="https://public-ui.github.io/en/docs/components"
						_icons="fa-solid fa-cubes"
						_label="Komponenten öffnen"
						_target="_blank"
					></kol-link>
				</kol-alert>
				<kol-alert _type="error" _label="MCP" _variant="card" _level="2">
					<kol-link
						_href="https://www.npmjs.com/package/@public-ui/mcp"
						_icons="fa-solid fa-robot"
						_label="MCP öffnen"
						_target="_blank"
					></kol-link>
				</kol-alert>
			</main>
		</div>

		<!-- KoliBri -->
		<script src="/node_modules/@public-ui/components/dist/kolibri/kolibri.esm.js" type="module"></script>
		<script src="/node_modules/@public-ui/react-standalone/dist/index.mjs" type="module"></script>

		<script type="module">
			import { register } from '/node_modules/@public-ui/components/dist/index.js';
			import { DEFAULT } from '/node_modules/@public-ui/theme-default/dist/index.mjs';
			register(DEFAULT, []).catch(console.warn);
		</script>
	</body>
</html>
