packages:
  # Client Side Rendering (CSR) Templates
  - 'csr/angular-cli/'
  - 'csr/preact-vite/'
  - 'csr/react-standalone/'
  - 'csr/react-vite/'
  - 'csr/react-vite-hook-form/'
  - 'csr/solid-vite/'
  - 'csr/static-page/'
  - 'csr/svelte-vite/'
  - 'csr/vue-vite/'

  # Server Side Rendering (SSR) Templates
  - 'ssr/astro/'
  - 'ssr/express/'
  - 'ssr/next.js/'
  - 'ssr/remix/'

  # KoliBri Library Templates
  # - 'kolibri/library/app/'
  - 'kolibri/library/components/'
  - 'kolibri/library/components/adapters/angular/'
  - 'kolibri/library/components/adapters/react/'
  - 'kolibri/library/components/adapters/vue/'
  - 'kolibri/library/schema/'
  - 'kolibri/library/theme/'
  - 'kolibri/theme/'

  # Utility Templates
  - 'svg2font/'
allowBuilds:
  '@parcel/watcher': true
  '@public-ui/components': true
  '@swc/core': true
  chromedriver: true
  core-js: true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  sharp: true
  ttf2woff2: true
